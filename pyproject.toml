[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epidemic-modeling"
version = "2.0.0"
description = "Parallel MATLAB and Python epidemic modeling tutorials by Reza Sameni"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Reza Sameni"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "build>=1,<2"]
neural = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
